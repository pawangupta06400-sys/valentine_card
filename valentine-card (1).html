<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffb6c1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 60px 80px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 500px;
            position: relative;
        }

        #question {
            transition: all 0.3s ease;
        }

        .cat {
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
            position: relative;
        }

        .cat-face {
            width: 140px;
            height: 140px;
            background: #f9a86e;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .cat-ear-left,
        .cat-ear-right {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid #f9a86e;
            position: absolute;
            top: -15px;
        }

        .cat-ear-left {
            left: 15px;
            transform: rotate(-25deg);
        }

        .cat-ear-right {
            right: 15px;
            transform: rotate(25deg);
        }

        /* Inner ear pink part */
        .cat-ear-left::after,
        .cat-ear-right::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 15px solid #ffb8a0;
            left: -10px;
            top: 5px;
        }

        .cat-eyes {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-top: 50px;
            position: relative;
        }

        .eye {
            width: 10px;
            height: 10px;
            background: #2c2c2c;
            border-radius: 50%;
        }

        .cat-nose {
            width: 12px;
            height: 10px;
            background: #ff9eb8;
            border-radius: 0 0 50% 50%;
            margin: 12px auto 0;
            position: relative;
        }

        /* Add cute blush */
        .blush-left,
        .blush-right {
            width: 20px;
            height: 12px;
            background: rgba(255, 182, 193, 0.4);
            border-radius: 50%;
            position: absolute;
            top: 70px;
        }

        .blush-left {
            left: 15px;
        }

        .blush-right {
            right: 15px;
        }

        .heart {
            position: absolute;
            top: -5px;
            right: 10px;
            font-size: 40px;
            animation: heartbeat 1.5s infinite;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-family: inherit;
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff1744 0%, #f50057 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }

        #yesBtn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        #yesBtn:hover::before {
            width: 300px;
            height: 300px;
        }

        #yesBtn:hover {
            background: linear-gradient(135deg, #d50000 0%, #c51162 100%);
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(255, 23, 68, 0.4);
        }

        #yesBtn:active {
            transform: scale(1.05);
        }

        #noBtn {
            background: linear-gradient(135deg, #e0e0e0 0%, #bdbdbd 100%);
            color: #666;
            position: absolute;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #noBtn:hover {
            background: linear-gradient(135deg, #d0d0d0 0%, #a0a0a0 100%);
            transform: scale(0.95) rotate(5deg);
        }

        .message {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        .emoji {
            margin-left: 5px;
        }

        /* Success message */
        .success {
            display: none;
            animation: fadeIn 0.5s ease;
            transition: all 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .success h2 {
            color: #ff1744;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .success p {
            color: #666;
            font-size: 18px;
            margin: 10px 0;
        }

        .hearts {
            font-size: 40px;
            margin: 10px 0;
        }

        .gif-container {
            margin: 20px 0;
            border-radius: 15px;
            overflow: hidden;
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .card {
                padding: 40px 30px;
                margin: 20px;
            }

            h1 {
                font-size: 22px;
            }

            button {
                padding: 12px 30px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="question">
            <div class="cat">
                <div class="cat-face">
                    <div class="cat-ear-left"></div>
                    <div class="cat-ear-right"></div>
                    <div class="cat-eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="cat-nose"></div>
                    <div class="blush-left"></div>
                    <div class="blush-right"></div>
                </div>
                <div class="heart">❤️</div>
            </div>

            <h1>Will you be my Valentine?</h1>

            <div class="buttons">
                <button id="yesBtn">Yes</button>
                <button id="noBtn">No</button>
            </div>

            <div class="message">"No" seems a bit shy <span class="emoji">😈</span></div>
        </div>

        <div id="success" class="success">
            <div class="hearts">💕💖💕</div>
            <h2>YAY! 🎉</h2>
            <div class="gif-container">
                <img src="https://media.giphy.com/media/g9582DNuQppxC/giphy.gif" alt="Celebration" style="width: 280px; height: 280px; border-radius: 15px; margin: 20px 0; box-shadow: 0 5px 20px rgba(0,0,0,0.15);">
            </div>
            <p style="font-size: 20px; font-weight: 600;">I knew you'd say yes!</p>
            <div class="hearts">💝💗💝</div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');
        const success = document.getElementById('success');

        // Function to move the No button to a random position
        function moveButton() {
            const card = document.querySelector('.card');
            const cardRect = card.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Calculate maximum positions to keep button inside card
            const maxX = cardRect.width - btnRect.width - 60; // More padding
            const maxY = 150; // Limit vertical movement

            // Generate random positions (avoid staying too close to original position)
            let randomX, randomY;
            do {
                randomX = Math.random() * maxX;
                randomY = (Math.random() * maxY) - 75;
            } while (Math.abs(randomX - 220) < 50); // Avoid staying near original position

            // Apply smooth transition
            noBtn.style.transition = 'all 0.3s ease';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Move button on hover
        noBtn.addEventListener('mouseenter', moveButton);

        // Move button on touch (for mobile)
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        // Also move on click attempt
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton();
        });

        // Yes button action
        yesBtn.addEventListener('click', () => {
            // Add a click animation
            yesBtn.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                question.style.opacity = '0';
                question.style.transform = 'scale(0.8)';
                
                setTimeout(() => {
                    question.style.display = 'none';
                    success.style.display = 'block';
                    success.style.opacity = '0';
                    success.style.transform = 'scale(0.8)';
                    
                    setTimeout(() => {
                        success.style.opacity = '1';
                        success.style.transform = 'scale(1)';
                    }, 50);
                    
                    // Add confetti effect
                    createConfetti();
                    
                    // Play celebration sound (optional - works if user has interacted with page)
                    try {
                        const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGmi87OmfTRAMUKXh8LZjHAU7k9n0y3krBSh+zPLaizsKGGS57OihUBELTKXh8bllHgU2jdXzzn0vBSl+zPDajDkKF2O77OmiUhELSp3d8LxnIAU7kdTy0H4yBSt/y/HajzsLGGK37OqiUhELSp3d8L5oIgQ7kdTy0H4yBSt/y/HajzsLGGK37OqiUhELSp3d8L5oIgQ7kdTy0H4yBSt/y/HajzsLGGK37OqiUhELSp3d8L5oIgQ7kdTy0H4yBSt/y/HajzsLGGK37OqiUhEL');
                        audio.play().catch(() => {}); // Ignore if autoplay blocked
                    } catch (e) {}
                }, 300);
            }, 200);
        });

        // Simple confetti effect
        function createConfetti() {
            const colors = ['#ff1744', '#ff69b4', '#ffc0cb', '#ff1493'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-10px';
                    confetti.style.borderRadius = '50%';
                    confetti.style.pointerEvents = 'none';
                    confetti.style.zIndex = '1000';
                    document.body.appendChild(confetti);

                    const duration = 3000 + Math.random() * 2000;
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = 2 + Math.random() * 3;

                    let posY = -10;
                    let posX = parseFloat(confetti.style.left);
                    const startTime = Date.now();

                    function fall() {
                        const elapsed = Date.now() - startTime;
                        if (elapsed < duration) {
                            posY += velocity;
                            posX += Math.sin(angle) * 2;
                            confetti.style.top = posY + 'px';
                            confetti.style.left = posX + 'px';
                            confetti.style.opacity = 1 - (elapsed / duration);
                            requestAnimationFrame(fall);
                        } else {
                            confetti.remove();
                        }
                    }
                    fall();
                }, i * 30);
            }
        }

        // Initialize button position
        noBtn.style.position = 'absolute';
        noBtn.style.left = '220px';
        noBtn.style.top = '0px';
    </script>
</body>
</html>
